<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Focuswilds turns focused time into a warm home for cats. Meet stray cats around the city and welcome them into your apartment." />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f2ebdc" />
    <meta name="application-version" content="%APP_VERSION%" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/src/loading.css" />
    <link rel="stylesheet" href="/src/fonts.css" />
    <link rel="stylesheet" href="/src/scrollbars.css" />
    <link rel="stylesheet" href="/src/button.css" />
    <link rel="stylesheet" href="/src/recovery.css" />
    <link rel="stylesheet" href="/src/content-layout.css" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Focuswilds</title>
    <style>
      :root { --page-bg: #f2ebdc; --text: #2e3037; --muted: #67616a; --accent: #e0cb83; --screen-width: 100svw; --screen-height: 100svh; }
      html, body { margin: 0; background: #f2ebdc; }
      .app-screen { position: fixed; left: 0; top: 0; width: var(--screen-width); height: var(--screen-height); container: screen / size; overflow: auto; overscroll-behavior: none; touch-action: pan-y; transform-origin: top left; }
      .orientation-notice { display: none; position: fixed; inset: 0; padding: 24px; align-items: center; justify-content: center; background: #f2ebdc; color: var(--text); font: 700 20px/1.5 'GNU Unifont',monospace; text-align: center; }
      @media (min-aspect-ratio: 1/1) { #root { display: none; } .orientation-notice { display: flex; } }
      .page-loading, .startup-recovery { position: absolute; inset: 0; z-index: 100; margin: 0; padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #f2ebdc; color: var(--text); font: 700 16px 'GNU Unifont',monospace; text-align: center; }
      .startup-recovery[hidden], .page-loading[hidden] { display: none; }
    </style>
    <script id="loading-visibility">
      function updateLoadingVisibility() {
        document.documentElement.style.setProperty('--loading-animation-state', document.hidden ? 'paused' : 'running');
      }
      updateLoadingVisibility();
      document.addEventListener('visibilitychange', updateLoadingVisibility);
    </script>
  </head>
  <body>
    <div class="orientation-notice" role="status">Please use portrait mode.<br/>Turn your device upright or make this window taller than it is wide.</div>
    <div id="root"><div class="app-screen"><main class="page-loading content-column" role="status" aria-label="Loading…"><span class="loading-cat" aria-hidden="true"></span><span class="loading-message">Loading…</span></main><main class="startup-recovery content-column" role="alert" hidden><span class="recovery-cat" aria-hidden="true"></span><h1>Something went wrong</h1><p>Please reload to try again.</p><button class="pixel-button" type="button" onclick="location.reload()">Reload</button><footer class="app-version">v%APP_VERSION%</footer></main><noscript><div class="startup-recovery content-column">Enable JavaScript to open Focuswilds.</div></noscript></div></div>
    <script id="update-loading">
      const params = new URLSearchParams(location.search);
      const loadingMessage = /^\d+\.\d+\.\d+$/.test(params.get('focuswilds-update') || '') ? 'Loading the latest version…' : params.has('focuswilds-auth') ? 'Signing in…' : null;
      if (loadingMessage) {
        const loading = document.querySelector('.page-loading');
        const message = loading.querySelector('.loading-message');
        message.textContent = loadingMessage;
        loading.setAttribute('aria-label', message.textContent);
      }
    </script>
    <script id="startup-error">
      window.addEventListener('error', event => {
        if (event.target?.tagName !== 'SCRIPT' || event.target.type !== 'module') return;
        const loading = document.querySelector('.page-loading');
        const recovery = document.querySelector('.startup-recovery');
        if (loading && recovery) { loading.hidden = true; recovery.hidden = false; }
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
