<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Focuswilds apartment prototype</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../src/fonts.css">
  <link rel="stylesheet" href="../../../src/button.css">
  <link rel="stylesheet" href="../../../src/content-layout.css">
  <link rel="stylesheet" href="../../../src/scrollbars.css">
  <link rel="stylesheet" href="../../../src/loading.css">
  <style>
    :root{--text:#303139;--page-bg:#f2ebdc}
    *{box-sizing:border-box}body{margin:0;background:#e5d7bd;color:#303139;font:700 var(--text-size)/var(--text-line-height) 'GNU Unifont',monospace;touch-action:manipulation}h1,p{margin:0}button,a{font-family:inherit}
    [hidden]{display:none!important}.shell{height:100dvh;max-width:var(--content-width);margin:auto;display:flex;flex-direction:column}
    header{display:flex;justify-content:space-between;align-items:start;gap:var(--space-group);padding:var(--screen-padding-top) var(--content-right) 0 var(--content-left);flex-shrink:0}
    h1{font-size:var(--screen-title-size);line-height:var(--screen-title-line-height)}.back{min-height:44px;padding:6px 10px;text-decoration:none;flex-shrink:0}
    .stage{position:relative;flex:1;min-height:270px;overflow:hidden}canvas{display:block;width:100%;height:100%;position:absolute;inset:0;image-rendering:pixelated;outline:none}
    #pet{position:absolute;padding:0;border:0;box-shadow:none;background:transparent;min-width:44px;min-height:44px;cursor:pointer}#pet::before,#pet::after{display:none}#pet:active{transform:none}#pet:focus-visible{outline:none;border:2px solid var(--text);clip-path:var(--pixel-outline)}
    .actions>button{background:#667969;box-shadow:inset 0 -4px #4c5f50}.actions nav button{background:#f2ebdc;color:#303139;box-shadow:inset 0 -4px #c6b99e}footer{display:grid;gap:var(--space-action);padding:var(--space-action) var(--content-right) var(--screen-padding-bottom) var(--content-left);flex-shrink:0}#notice{text-align:center;min-height:27px}.actions{display:grid;gap:var(--space-section)}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-group)}nav button{padding-inline:4px}
    .page-loading{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:var(--space-action);padding:24px;background:#f2ebdc;text-align:center}
    .page-loading .pixel-button{width:100%;max-width:calc(var(--content-width) - var(--content-left) - var(--content-right))}
    #portrait{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:24px;text-align:center;background:#f2ebdc}
    @media (orientation:landscape),(aspect-ratio:1/1){.shell,.page-loading{visibility:hidden}#portrait{display:grid}}
  </style>
</head>
<body>
  <main class="page-loading" id="loading" role="status" aria-label="Loading…"><span class="loading-cat" aria-hidden="true"></span><p class="message-copy" id="loading-message">Loading…</p><button class="pixel-button" id="retry" hidden>Reload</button></main>
  <main class="shell" id="shell" hidden>
    <header><div><h1>Your home</h1><p>Lv. 1 / 0 coins</p></div><a class="pixel-button back" href="../../../">Back</a></header>
    <section class="stage" aria-label="Apartment"><canvas id="canvas" aria-hidden="true" tabindex="-1"></canvas><button id="pet" class="pixel-button" aria-label="Pet your black cat" hidden></button></section>
    <footer><p id="notice" role="status" aria-live="polite">Your black cat</p><div class="actions"><button class="pixel-button" disabled aria-describedby="prototype-description">Start focus</button><nav aria-label="Game areas"><button class="pixel-button" disabled>Cats</button><button class="pixel-button" disabled>City</button><button class="pixel-button" disabled>Shop</button></nav></div></footer>
    <span id="prototype-description" hidden>Scene prototype. Gameplay remains in the main application.</span>
  </main>
  <p id="portrait">Please turn your device upright.</p>
  <script src="$GODOT_URL"></script>
  <script>
    const loading=document.getElementById('loading'),shell=document.getElementById('shell'),pet=document.getElementById('pet');
    const began=performance.now();let failed=false;let startupDeadline;
    const isVisible=()=>!document.hidden&&innerHeight>innerWidth;
    function syncVisibility(){document.documentElement.style.setProperty('--loading-animation-state',isVisible()?'running':'paused');window.focuswildsSetVisible?.(isVisible()&&!failed);}
    window.focuswildsGraphicsState=active=>{document.body.dataset.rendering=active?'active':'paused';};
    window.focuswildsCatNotice=()=>{document.getElementById('notice').textContent='Your cat noticed you.';};
    window.focuswildsSceneReady=(x,y,width,height)=>{if(failed)return;clearTimeout(startupDeadline);shell.style.visibility='';Object.assign(pet.style,{left:x+'px',top:y+'px',width:width+'px',height:height+'px'});pet.hidden=false;loading.hidden=true;shell.hidden=false;document.body.dataset.ready='true';document.body.dataset.loadMs=(performance.now()-began).toFixed(0);syncVisibility();};
    pet.addEventListener('click',()=>window.focuswildsPetCat?.());
    document.addEventListener('visibilitychange',syncVisibility);addEventListener('resize',syncVisibility);addEventListener('pagehide',()=>window.focuswildsSetVisible?.(false));addEventListener('pageshow',syncVisibility);
    document.getElementById('retry').onclick=()=>location.reload();
    window.addEventListener('error',showFailure);
    window.addEventListener('unhandledrejection',event=>{event.preventDefault();event.stopImmediatePropagation();showFailure();});
    const engine=new Engine($GODOT_CONFIG);
    // Keep layout measurable behind Loading; reveal only after the scene is ready.
    shell.hidden=false;shell.style.visibility='hidden';
    const canvas=document.getElementById('canvas');
    const resizeCanvas=()=>{const r=canvas.parentElement.getBoundingClientRect();canvas.width=Math.round(r.width);canvas.height=Math.round(r.height);};
    resizeCanvas();new ResizeObserver(resizeCanvas).observe(canvas.parentElement);
    function showFailure(){
      failed=true;clearTimeout(startupDeadline);window.focuswildsSetVisible?.(false);shell.style.visibility='hidden';loading.hidden=false;loading.setAttribute('role','alert');loading.setAttribute('aria-label','Unable to open the scene');
      const lines=['Unable to open the scene.','Please reload to try again.'].map(text=>{const span=document.createElement('span');span.className='message-copy-line';span.textContent=text;return span;});
      document.getElementById('loading-message').replaceChildren(...lines);document.getElementById('retry').hidden=false;
    }
    canvas.addEventListener('webglcontextlost',event=>{event.preventDefault();event.stopImmediatePropagation();showFailure();});
    startupDeadline=setTimeout(showFailure,120000);
    engine.startGame({canvas}).catch(showFailure);
  </script>
</body>
</html>
